<!DOCTYPE html>

  <title>CV — Lucy Barlow</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .cv-frame {
      width: 100%;
      height: 85vh;
      min-height: 600px;
      border: 1px solid rgba(255,251,252,.1);
      border-radius: 4px;
      background: #fff;
    }
    .cv-actions {
      margin-top: 24px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 999px;
      font-family: var(--body);
      font-weight: 500;
      transition: all .2s ease;
    }
    .btn:hover { color: var(--pink); border-color: var(--pink); }
  </style>
</head>

      <div class="cv-actions">
        <a class="btn" href="images/cv.pdf" download>
          Download PDF
